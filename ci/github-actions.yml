name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - run: MT_INTEGRATION=1 go test -race -count=1 ./internal/tmux
      - run: make build
      - run: bin/mt --version && bin/mt --help

  release-archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release VERSION=0.1.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: mt-archives
          path: dist/
